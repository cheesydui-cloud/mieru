services:
  panel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PANEL_LISTEN: ":8080"
      PANEL_DB: /data/panel.db
      PANEL_DATA: /data
      PANEL_JWT_SECRET: ${PANEL_JWT_SECRET:-change-me-in-production}
      PANEL_ADMIN_USER: ${PANEL_ADMIN_USER:-admin}
      PANEL_ADMIN_PASS: ${PANEL_ADMIN_PASS:-admin123}
    volumes:
      - panel-data:/data
    restart: unless-stopped

volumes:
  panel-data:
